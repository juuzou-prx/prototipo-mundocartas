{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'recompensa_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
