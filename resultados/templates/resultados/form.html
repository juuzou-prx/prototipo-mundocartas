{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<h1 class="h3 mb-1">{{ titulo }}</h1>
<p class="text-muted mb-3">{{ torneo.nombre }} · {{ torneo.fecha|date:"d/m/Y" }}</p>
<form method="post">
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{% url 'resultado_lista' torneo.pk %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
