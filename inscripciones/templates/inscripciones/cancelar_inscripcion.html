{% extends "base.html" %}
{% block title %}Cancelar inscripción{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Cancelar inscripción</h1>
<p>¿Seguro que quieres cancelar tu inscripción en <strong>{{ inscripcion.torneo.nombre }}</strong>? Tu cupo quedará libre para otro jugador.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, cancelar inscripción</button>
  <a href="{% url 'mis_inscripciones' %}" class="btn btn-outline-secondary">Volver</a>
</form>
{% endblock %}
