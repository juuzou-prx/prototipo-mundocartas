{% extends "base.html" %}
{% block title %}Cancelar torneo{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Cancelar torneo</h1>
<p>¿Seguro que quieres cancelar <strong>{{ torneo.nombre }}</strong>? Seguirá apareciendo en la lista con estado Cancelado.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, cancelar torneo</button>
  <a href="{% url 'torneo_lista' %}" class="btn btn-outline-secondary">Volver</a>
</form>
{% endblock %}
