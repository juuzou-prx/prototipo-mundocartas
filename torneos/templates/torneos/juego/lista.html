{% extends "base.html" %}
{% block title %}Juegos{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Juegos</h1>
  <a href="{% url 'juego_crear' %}" class="btn btn-primary">Nuevo juego</a>
</div>
<table class="table table-striped align-middle">
  <thead>
    <tr><th>Nombre</th><th>Descripción</th><th class="text-end">Acciones</th></tr>
  </thead>
  <tbody>
    {% for juego in juegos %}
    <tr>
      <td>{{ juego.nombre }}</td>
      <td>{{ juego.descripcion }}</td>
      <td class="text-end">
        <a href="{% url 'juego_editar' juego.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
        <a href="{% url 'juego_eliminar' juego.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3" class="text-center text-muted">Aún no hay juegos registrados.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
