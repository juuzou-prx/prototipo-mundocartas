{% extends "base.html" %}
{% block title %}Eliminar juego{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Eliminar juego</h1>
<p>¿Seguro que quieres eliminar <strong>{{ juego.nombre }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'juego_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
